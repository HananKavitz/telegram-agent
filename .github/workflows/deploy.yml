name: Deploy to Digital Ocean

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build Docker image
        run: docker build -t telegram-agent:${{ github.sha }} .

      - name: Tag and push to DO Container Registry
        env:
          DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
        run: |
          docker tag telegram-agent:${{ github.sha }} \
            registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/telegram-agent:${{ github.sha }}
          docker tag telegram-agent:${{ github.sha }} \
            registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/telegram-agent:latest
          docker push \
            registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/telegram-agent:${{ github.sha }}
          docker push \
            registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/telegram-agent:latest

      - name: Deploy to App Platform
        env:
          DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
          DO_APP_ID: ${{ secrets.DO_APP_ID }}
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $DO_API_TOKEN" \
            "https://api.digitalocean.com/v2/apps/$DO_APP_ID/deployments" \
            -d '{"force_build": true}'
